services:
  api:
    build:
      context: ../../apps/api
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////data/clash_detection.db
      STORAGE_ROOT: /data/storage
      WEB_ORIGINS: http://localhost:8080
      INFERENCE_PROVIDER: ${INFERENCE_PROVIDER:-openai}
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-http://host.docker.internal:8001/v1}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-local}
      MODEL_NAME: Qwen/Qwen2.5-VL-7B-Instruct
      SERVED_MODEL_NAME: clash-detection-qwen2.5-vl-7b
      ADAPTER_NAME: train_2026-07-29-14-13-40
    volumes:
      - clash-data:/data
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      args:
        VITE_API_URL: /api
    depends_on:
      api:
        condition: service_started
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  clash-data:
