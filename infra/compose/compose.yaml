services:
  api:
    build:
      context: ../../apps/api
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////data/clash_detection.db
      STORAGE_ROOT: /data/storage
      WEB_ORIGINS: http://localhost:8080
      INFERENCE_PROVIDER: ${INFERENCE_PROVIDER:-mock}
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-http://model:8000/v1}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-local}
      MODEL_NAME: Qwen/Qwen3-VL-2B-Instruct
      SERVED_MODEL_NAME: clash-detection-qwen3-vl-2b
      ADAPTER_NAME: train_2026-06-27-00-01-40
    volumes:
      - clash-data:/data
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      args:
        VITE_API_URL: /api
    depends_on:
      api:
        condition: service_started
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  clash-data:

